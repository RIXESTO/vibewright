<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendAutomator MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>TrendAutomator</h1>
            </div>
            <button id="trigger-btn" class="glow-on-hover" onclick="triggerAutomation()">
                <span class="btn-text">Run Automation Pipeline</span>
                <div class="loader" id="loader"></div>
            </button>
        </header>

        <main>
            <div class="glass-panel stats-panel">
                <h2>Pipeline Status</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-value">Active</span>
                        <span class="stat-label">System</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="post-count">0</span>
                        <span class="stat-label">Posts Generated</span>
                    </div>
                </div>
            </div>

            <div class="feed-section">
                <h2>Generated Content Feed</h2>
                <div id="posts-container" class="posts-container">
                    <!-- Posts will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
